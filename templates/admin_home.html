<!DOCTYPE html>
<html lang="en">
<head>
    <title>🔐 Admin Home - Product Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; color: rgb(139, 55, 55);
        }

        /* Navbar */
        .navbar {
            position: fixed; top: 0; width: 100%; 
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            padding: 15px 0; z-index: 1000; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .nav-container {
            max-width: 1400px; margin: 0 auto; 
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 40px;
        }
        .logo { font-size: 1.8rem; font-weight: 700; color: #333; cursor: pointer; }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        
        /* Buttons */
        .btn { 
            padding: 12px 24px; border: none; border-radius: 25px; 
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            font-family: inherit;
        }
        .btn-primary { background: linear-gradient(45deg, #667eea, #764ba2); color: white; }
        .btn-success { background: linear-gradient(45deg, #28a745, #20c997); color: white; }
        .btn-danger { background: linear-gradient(45deg, #ff6b6b, #ee5a52); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #c75252; border: 1px solid rgba(255,255,255,0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }

        /* Main Container */
        .container { max-width: 1400px; margin: 120px auto 40px; padding: 0 40px; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px; flex-wrap: wrap; gap: 20px;
        }
        .header h1 { font-size: 2.8rem; font-weight: 700; }

        /* Metrics Grid */
        .metrics-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px; margin-bottom: 50px;
        }
        .metric-card {
            background: rgba(255,255,255,0.15); padding: 30px 25px;
            border-radius: 20px; text-align: center; transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .metric-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .metric-icon { font-size: 2.5rem; margin-bottom: 15px; opacity: 0.9; }
        .metric-number { font-size: 2.5rem; font-weight: 700; color: #ffd700; }
        .metric-label { font-size: 1rem; opacity: 0.9; }

        /* Products Section */
        .products-section { 
            background: rgba(255,255,255,0.1); border-radius: 25px; padding: 40px; 
            backdrop-filter: blur(10px);
        }
        .table-container { overflow-x: auto; margin-top: 30px; }
        table {
            width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.95);
            border-radius: 15px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-width: 900px;
        }
        th, td { padding: 20px 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { 
            background: linear-gradient(135deg, #667eea, #764ba2); color: white; 
            font-weight: 600; position: sticky; top: 0; z-index: 10;
        }
        .status-badge { 
            padding: 8px 16px; border-radius: 25px; font-size: 0.85rem; 
            font-weight: 600; text-transform: uppercase;
        }
        .status-active { background: #d4edda; color: #155724; }
        .status-inactive { background: #f8d7da; color: #721c24; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; margin-left: 8px; }

        /* Action Buttons */
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-small { padding: 10px 20px; font-size: 14px; min-width: 90px; }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(10px);
        }
        .modal-content {
            background: white; margin: 5% auto; padding: 0; border-radius: 25px;
            width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto;
            position: relative; transform: scale(0.7); animation: modalPop 0.4s forwards;
        }
        @keyframes modalPop { to { transform: scale(1); } }
        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            padding: 30px; border-radius: 25px 25px 0 0; text-align: center;
            position: relative;
        }
        .close { 
            position: absolute; right: 25px; top: 25px; font-size: 28px; 
            cursor: pointer; color: rgba(255,255,255,0.8); transition: 0.3s;
        }
        .close:hover { color: white; transform: scale(1.2); }
        .modal-body { padding: 40px; color: #333; }
        .form-group { margin-bottom: 25px; }
        .form-group label { 
            display: block; margin-bottom: 8px; font-weight: 600; color: #333; 
        }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 15px 20px; border: 2px solid #eee; 
            border-radius: 12px; font-size: 16px; font-family: inherit;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .modal-actions {
            display: flex; gap: 15px; justify-content: flex-end; margin-top: 30px;
            padding: 20px 40px 40px;
        }

        .notification {
            position: fixed; top: 140px; right: 20px; padding: 20px 30px;
            border-radius: 15px; font-weight: 500; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: translateX(400px); transition: all 0.4s ease; z-index: 3000;
            max-width: 450px;
        }
        .notification.success { background: #4ecdc4; color: white; }
        .notification.error { background: #ff6b6b; color: white; }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .action-buttons { flex-direction: column; }
            .container { padding: 0 20px; }
            th, td { padding: 15px 10px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="location.href='/admin/dashboard'">
                <i class="fas fa-shield-alt"></i> Admin Panel
            </div>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-secondary">
                    <i class="fas fa-chart-bar"></i> Dashboard
                </a>
                <a href="campaign.html" class="btn btn-secondary">
                    <i class="fas fa-robot"></i> Campaigns
                </a>
                <a href="logout" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1><i class="fas fa-boxes"></i> Product Management</h1>
                <p style="opacity: 0.8; margin-top: 5px;">Admin-only: Add, Edit, Delete products</p>
            </div>
            <button class="btn btn-success" onclick="openModal('add')">
                <i class="fas fa-plus"></i> Add Product
            </button>
        </div>

        <!-- Metrics -->
        <div class="metrics-grid" id="metricsGrid">
            <div class="metric-card">
                <div class="metric-icon" style="color: #4ecdc4;">📦</div>
                <div class="metric-number" id="totalProducts">0</div>
                <div>Total Products</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon" style="color: #28a745;">✅</div>
                <div class="metric-number" id="activeProducts">0</div>
                <div>Active Products</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon" style="color: #ffd700;">🔥</div>
                <div class="metric-number" id="topSearches">0</div>
                <div>Top Searches</div>
            </div>
        </div>

        <!-- Products Table -->
        <div class="products-section">
            <h3 style="margin-bottom: 25px; font-size: 1.5rem;">
                <i class="fas fa-list"></i> All Products
            </h3>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Searches</th>
                            <th>Status</th>
                            <th>Badge</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 50px; color: #666;">
                                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 15px; display: block;"></i>
                                Loading products...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle">Add New Product</h2>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="editProductId">
                    
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Product Name *</label>
                        <input type="text" id="productName" placeholder="iPhone 15 Pro Max" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-list"></i> Category *</label>
                            <select id="productCategory" required>
                                <option value="">Select Category</option>
                                <option value="electronics">⚡ Electronics</option>
                                <option value="fashion">👕 Fashion</option>
                                <option value="sports">⚽ Sports</option>
                                <option value="books">📚 Books</option>
                                <option value="home">🏠 Home & Garden</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-dollar-sign"></i> Price ($) *</label>
                            <input type="number" id="productPrice" placeholder="1199.99" step="0.01" min="0" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-toggle-on"></i> Status *</label>
                            <select id="productStatus" required>
                                <option value="active">✅ Active</option>
                                <option value="inactive">⏸️ Inactive</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-crown"></i> Priority Badge</label>
                            <select id="productBadge">
                                <option value="">None</option>
                                <option value="top">🏆 TOP PRIZE</option>
                                <option value="silver">🥈 SILVER</option>
                                <option value="hot">🔥 HOT DEAL</option>
                                <option value="value">💎 BEST VALUE</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-smile"></i> Emoji Icon</label>
                        <input type="text" id="productIcon" placeholder="📱 or 👟" maxlength="5">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-align-left"></i> Description</label>
                            <textarea id="productDescription" rows="3" placeholder="Short product description..."></textarea>
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-link"></i> Product URL</label>
                            <input type="url" id="productUrl" placeholder="https://example.com/product">
                        </div>
                    </div>

                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 
                            <span id="saveBtnText">Save Product</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notification" class="notification" style="display: none;"></div>

    <script>
        let products = [];
        let isEditing = false;

        // Role-based access check
        function checkAdminAccess() {
            fetch('/api/admin/check', { credentials: 'include' })
                .then(res => res.json())
                .then(data => {
                    if (!data.isAdmin) {
                        alert('Admin access required!');
                        window.location.href = '/admin_home.html';
                    }
                })
                .catch(() => window.location.href = '/admin_home.html');
        }

        // Show notification
        function showNotification(message, type = 'success') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification ${type}`;
            notif.style.display = 'block';
            notif.style.transform = 'translateX(0)';
            
            setTimeout(() => {
                notif.style.transform = 'translateX(400px)';
                setTimeout(() => notif.style.display = 'none', 400);
            }, 4000);
        }

        // Load products
        async function loadProducts() {
            try {
                const response = await fetch('/api/admin/products', { credentials: 'include' });
                if (response.status === 403) {
                    window.location.href = '/admin_home.html';
                    return;
                }
                products = await response.json();
                renderTable();
                updateMetrics();
            } catch (error) {
                console.error('Load error:', error);
                document.getElementById('productsTableBody').innerHTML = 
                    '<tr><td colspan="8" style="text-align:center;padding:50px;color:#666">Error loading products</td></tr>';
            }
        }

        // Render table
        function renderTable() {
            const tbody = document.getElementById('productsTableBody');
            if (products.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 50px; color: #666;">
                            <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 20px; opacity: 0.5;"></i>
                            <div>No products found. <button class="btn btn-primary" onclick="openModal('add')" style="margin-top: 15px;">Add your first product</button></div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = products.map(product => `
                <tr>
                    <td>${product.id?.slice(-8) || 'N/A'}</td>
                    <td>
                        <div style="font-weight: 600;">${product.icon || '📦'} ${product.name}</div>
                        ${product.description ? `<small style="color:#666">${product.description}</small>` : ''}
                    </td>
                    <td><span style="text-transform: capitalize;">${product.category || 'uncat'}</span></td>
                    <td><strong>$${parseFloat(product.price || 0).toFixed(2)}</strong></td>
                    <td>${product.searches || 0}</td>
                    <td><span class="status-badge status-${product.status || 'inactive'}">${product.status?.toUpperCase() || 'INACTIVE'}</span></td>
                    <td>${product.badge ? `<span class="badge" style="background: #ffd700; color: #333;">${product.badge}</span>` : '-'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-success btn-small" onclick="editProduct('${product.id}')" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-danger btn-small" onclick="deleteProduct('${product.id}', '${product.name}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Update metrics
        function updateMetrics() {
            document.getElementById('totalProducts').textContent = products.length;
            document.getElementById('activeProducts').textContent = products.filter(p => p.status === 'active').length;
            const topProduct = products.reduce((max, p) => (p.searches || 0) > (max.searches || 0) ? p : max, {});
            document.getElementById('topSearches').textContent = topProduct.searches || 0;
        }

        // Modal operations
        function openModal(mode = 'add') {
            isEditing = mode === 'edit';
            document.getElementById('modalTitle').textContent = isEditing ? 'Edit Product' : 'Add New Product';
            document.getElementById('saveBtnText').textContent = isEditing ? 'Update Product' : 'Add Product';
            if (!isEditing) document.getElementById('productForm').reset();
            document.getElementById('productModal').style.display = 'block';
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return showNotification('Product not found!', 'error');
            
            document.getElementById('editProductId').value = product.id;
            document.getElementById('productName').value = product.name || '';
            document.getElementById('productCategory').value = product.category || '';
            document.getElementById('productPrice').value = product.price || '';
            document.getElementById('productStatus').value = product.status || 'active';
            document.getElementById('productBadge').value = product.badge || '';
            document.getElementById('productIcon').value = product.icon || '';
            document.getElementById('productDescription').value = product.description || '';
            document.getElementById('productUrl').value = product.url || '';
            
            openModal('edit');
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
            document.getElementById('productForm').reset();
            isEditing = false;
        }

        // Form submit
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            const productData = {
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                status: document.getElementById('productStatus').value,
                badge: document.getElementById('productBadge').value,
                icon: document.getElementById('productIcon').value,
                description: document.getElementById('productDescription').value,
                url: document.getElementById('productUrl').value
            };

            try {
                const url = isEditing 
                    ? `/api/admin/products/${document.getElementById('editProductId').value}`
                    : '/api/admin/products';
                const method = isEditing ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    closeModal();
                    loadProducts();
                    showNotification(isEditing ? 'Product updated successfully!' : 'Product added successfully!');
                } else {
                    throw new Error(await response.text());
                }
            } catch (error) {
                showNotification('Error saving product: ' + error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Delete product
        async function deleteProduct(id, name) {
            if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
            
            try {
                const response = await fetch(`/api/admin/products/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (response.ok) {
                    loadProducts();
                    showNotification('Product deleted successfully!');
                } else {
                    throw new Error('Delete failed');
                }
            } catch (error) {
                showNotification('Error deleting product!', 'error');
            }
        }

        // Close modal on outside click
        window.onclick = (event) => {
            const modal = document.getElementById('productModal');
            if (event.target === modal) closeModal();
        }

        // Initialize
        checkAdminAccess();
        loadProducts();
    </script>
</body>
</html>
