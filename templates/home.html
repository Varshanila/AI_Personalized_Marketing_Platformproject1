<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Powered E-Commerce Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
}

/* HEADER */
.header{
    background:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.logo h1{
    font-size:28px;
    background:linear-gradient(135deg,#4ecdc4,#44a08d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
}
.user-info{display:flex;gap:15px;align-items:center}
.notification,button{
    padding:10px 18px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    font-weight:600;
}
.notification{background:#4ecdc4;color:white}
button{background:#ef4444;color:white}

/* MAIN */
.main-content{max-width:1400px;margin:40px auto;padding:0 20px}
.search-section{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    margin-bottom:40px;
}
.search-box{
    width:100%;
    max-width:600px;
    padding:16px;
    border-radius:30px;
    border:2px solid #ddd;
    font-size:16px;
}

/* PRODUCTS */
.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:30px;
}
.product-card{
    background:white;
    padding:25px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(0,0,0,.1);
    transition:.3s;
    position:relative;
}
.product-card:hover{transform:translateY(-8px)}
.product-badge{
    position:absolute;top:15px;right:15px;
    background:#ffd700;color:#333;
    padding:5px 12px;border-radius:20px;
    font-size:12px;font-weight:600;
}
.product-image{font-size:60px;text-align:center;margin:15px 0}
.product-name{font-size:20px;font-weight:700;margin:10px 0}
.product-price{color:#4ecdc4;font-size:22px;font-weight:700}
.product-category{
    font-size:13px;
    background:#667eea;
    color:white;
    padding:4px 12px;
    border-radius:20px;
    display:inline-block;
    margin:8px 0;
}
.product-desc{color:#666;font-size:14px;margin-bottom:12px}
.product-tags span{
    font-size:11px;
    background:#f0f0f0;
    padding:4px 8px;
    border-radius:12px;
    margin-right:5px;
}

/* 🔥 ADD TO CART BUTTON */
.add-to-cart{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:25px;
    background:linear-gradient(45deg,#4ecdc4,#44a08d);
    color:white;
    font-weight:600;
    border:none;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}
.add-to-cart:hover{background:#44a08d;transform:scale(1.02)}

/* 🔥 ORDER CONFIRMATION POPUP */
.order-popup{
    display:none;
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 25px 50px rgba(0,0,0,.4);
    text-align:center;
    z-index:5000;
    max-width:400px;
    animation:popupSlide 0.4s ease;
}
@keyframes popupSlide{
    from{opacity:0;transform:translate(-50%,-50%) scale(0.7)}
    to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.popup-icon{font-size:60px;margin-bottom:20px}
.success-popup .popup-icon{color:#10b981}
.error-popup .popup-icon{color:#ef4444}

/* CART */
#cartDrawer{
    position:fixed;
    top:0;
    right:-400px;
    width:380px;
    height:100%;
    background:white;
    box-shadow:-10px 0 30px rgba(0,0,0,.3);
    padding:20px;
    transition:.4s;
    z-index:3000;
    overflow-y:auto;
}

/* MODAL */
#productModal{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,.6);
    z-index:4000;
    justify-content:center;
    align-items:center;
}
.modal-box{
    background:white;
    padding:35px;
    border-radius:20px;
    max-width:500px;
    max-height:80vh;
    overflow-y:auto;
}
.modal-image{font-size:80px;text-align:center;margin-bottom:20px}
.modal-price{font-size:28px;color:#4ecdc4;font-weight:700}

/* CHECKOUT */
#checkoutPage{
    display:none;
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:#f8fafc;
    z-index:5000;
    padding:40px;
    overflow:auto;
}

/* LOADING */
.loading{opacity:0.6;pointer-events:none}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #f3f3f3;border-top:2px solid #4ecdc4;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
</style>
</head>

<body>
<header class="header">
    <div class="logo"><h1>🛒 AI E-Commerce</h1></div>
    <div class="user-info">
        <div class="notification" onclick="toggleCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
        <button onclick="submitAdmin()">Admin Login</button>
    </div>
</header>

<div class="main-content">
    <div class="search-section">
        <h2>🔍 Browse Products</h2><br>
        <input class="search-box" id="searchInput" placeholder="Search products…">
    </div>

    <div class="search-section">
        <h2>🤖 AI Recommended For You</h2>
        <div class="products-grid" id="recommendedGrid"></div>
    </div>

    <!-- 🔥 DYNAMIC PRODUCTS FROM ADMIN -->
    <div class="products-grid" id="productsGrid">
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:#666">
            <i class="fas fa-spinner fa-spin" style="font-size:40px;margin-bottom:20px;display:block"></i>
            Loading products from admin panel...
        </div>
    </div>
</div>

<!-- 🔥 CART -->
<div id="cartDrawer">
    <h2>🛒 Your Cart</h2><hr><br>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="cartTotal">0</span></h3>
    <button style="width:100%;margin-top:15px;background:#4ecdc4;color:white" onclick="goToCheckout()">Checkout</button>
    <button style="width:100%;margin-top:10px;background:#6b7280;color:white" onclick="toggleCart()">Close</button>
</div>

<!-- 🔥 PRODUCT DETAIL MODAL -->
<div id="productModal">
    <div class="modal-box">
        <div class="modal-image" id="modalImage"></div>
        <h2 id="modalName"></h2>
        <p id="modalDesc"></p>
        <div class="modal-price" id="modalPrice"></div>
        <div style="margin:25px 0">
            <button class="add-to-cart" id="modalAddToCart" onclick="addToCartFromModal()">
                <span id="modalCartText">Add to Cart</span>
                <span id="modalSpinner" class="spinner" style="display:none"></span>
            </button>
        </div>
        <button onclick="closeModal()" style="width:100%;padding:12px;background:#6b7280;color:white;border:none;border-radius:25px">Close</button>
    </div>
</div>

<!-- 🔥 ORDER CONFIRMATION POPUP -->
<div id="orderPopup" class="order-popup">
    <div class="popup-icon" id="popupIcon">✅</div>
    <h3 id="popupTitle">Order Confirmed!</h3>
    <p id="popupMessage">Your order has been placed successfully!</p>
    <button onclick="closeOrderPopup()" style="margin-top:20px;padding:12px 30px;background:#4ecdc4;color:white;border:none;border-radius:25px;font-weight:600;cursor:pointer">Continue Shopping</button>
</div>

<!-- 🔥 CHECKOUT -->
<div id="checkoutPage">
    <h2>💳 Checkout</h2><br>
    <div id="checkoutItems"></div>
    <h3>Total Payable: ₹<span id="checkoutTotal">0</span></h3><br>
    <button onclick="placeOrder()" style="padding:15px 40px;background:#4ecdc4;color:white;border:none;border-radius:25px;font-size:18px;font-weight:600">Place Order</button>
    <button onclick="closeCheckout()" style="padding:15px 40px;background:#6b7280;color:white;border:none;border-radius:25px;margin-left:15px">Cancel</button>
</div>

<script>
let products = [];
let filteredProducts = [];
let cart = JSON.parse(localStorage.getItem("cart") || "[]");
let prefs = JSON.parse(localStorage.getItem("prefs") || "{}");

// 🔥 LOAD DYNAMIC PRODUCTS FROM ADMIN API
async function loadProducts() {
    try {
        const response = await fetch('/api/admin/products');
        const adminProducts = await response.json();
        
        // Merge admin products with static fallback
        products = adminProducts.length > 0 ? adminProducts : [
            // Your existing static products as fallback
            { id: 1, name: "Sony WH-1000XM5", price: 29990, category: "Electronics", icon: "🎧", description: "Industry-leading noise cancellation.", badge: "hot" },
            { id: 2, name: "Samsung Galaxy S24", price: 129999, category: "Electronics", icon: "📱", description: "200MP camera with Galaxy AI.", badge: "top" }
        ];
        
        filteredProducts = [...products];
        renderProducts();
        updateRecommendations();
    } catch (error) {
        console.error('Failed to load admin products:', error);
        // Fallback to static products
        products = filteredProducts = [
            { id: 1, name: "Sony WH-1000XM5", price: 29990, category: "Electronics", icon: "🎧", description: "Industry-leading noise cancellation.", badge: "hot" }
        ];
        renderProducts();
    }
}

// 🔥 RENDER PRODUCTS GRID
function renderProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = filteredProducts.map(p => `
        <div class="product-card" onclick="openProductModal('${p.id}')">
            ${p.badge ? `<div class="product-badge">${p.badge.toUpperCase()}</div>` : ''}
            <div class="product-image">${p.icon || '📦'}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">₹${parseFloat(p.price || 0).toLocaleString()}</div>
            <div class="product-category">${p.category}</div>
            <div class="product-desc">${p.description?.substring(0, 100) || 'No description'}</div>
        </div>
    `).join('') || '<div style="grid-column:1/-1;text-align:center;padding:60px;color:#666">No products found</div>';
}

// 🔥 OPEN PRODUCT MODAL WITH DESCRIPTION + ADD TO CART
function openProductModal(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    
    document.getElementById('modalImage').textContent = product.icon || '📦';
    document.getElementById('modalName').textContent = product.name;
    document.getElementById('modalDesc').textContent = product.description || 'No description available.';
    document.getElementById('modalPrice').textContent = `₹${parseFloat(product.price || 0).toLocaleString()}`;
    document.getElementById('modalAddToCart').dataset.productId = id;
    document.getElementById('productModal').style.display = 'flex';
    
    trackPref(product.category);
    updateRecommendations(product);
}

// 🔥 ADD TO CART FROM MODAL
function addToCartFromModal() {
    const productId = document.getElementById('modalAddToCart').dataset.productId;
    addToCart({stopPropagation: () => {}}, productId);
}

// 🔥 SEARCH
document.getElementById('searchInput').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    filteredProducts = products.filter(p => 
        p.name.toLowerCase().includes(q) || 
        p.category.toLowerCase().includes(q) ||
        p.description?.toLowerCase().includes(q)
    );
    renderProducts();
};

// 🔥 CART FUNCTIONS (unchanged)
function addToCart(e, id) {
    e?.stopPropagation();
    const product = products.find(p => p.id === id);
    if (!product) return;
    
    cart.push({...product, quantity: 1});
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartUI();
    
    // 🔥 SHOW ORDER CONFIRMATION POPUP
    showOrderPopup(true, `${product.name} added to cart!`);
}

function removeFromCart(i) {
    cart.splice(i, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartUI();
}

function updateCartUI() {
    document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartItemsEl = document.getElementById('cartItems');
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    document.getElementById('cartTotal').textContent = total.toLocaleString();
    
    cartItemsEl.innerHTML = cart.map((p, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:15px;background:#f8fafc;border-radius:12px">
            <div>
                <div style="font-weight:600">${p.icon} ${p.name}</div>
                <div>₹${parseFloat(p.price).toLocaleString()} x ${p.quantity}</div>
            </div>
            <button onclick="removeFromCart(${i})" style="background:#ef4444;color:white;border:none;border-radius:20px;padding:8px 12px;cursor:pointer">Remove</button>
        </div>
    `).join('') || '<div style="text-align:center;color:#666;padding:40px">Cart is empty</div>';
}

function toggleCart() {
    document.getElementById('cartDrawer').style.right = 
        document.getElementById('cartDrawer').style.right === "0px" ? "-400px" : "0px";
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
}

// 🔥 BEAUTIFUL ORDER POPUP
function showOrderPopup(success, message) {
    const popup = document.getElementById('orderPopup');
    document.getElementById('popupTitle').textContent = success ? '✅ Added to Cart!' : '❌ Error';
    document.getElementById('popupMessage').textContent = message;
    document.getElementById('popupIcon').textContent = success ? '🛒' : '⚠️';
    popup.className = `order-popup ${success ? 'success-popup' : 'error-popup'}`;
    popup.style.display = 'block';
}

function closeOrderPopup() {
    document.getElementById('orderPopup').style.display = 'none';
}

// 🔥 RECOMMENDATIONS
function trackPref(cat) {
    prefs[cat] = (prefs[cat] || 0) + 1;
    localStorage.setItem("prefs", JSON.stringify(prefs));
}

function updateRecommendations(clickedProduct) {
    const recGrid = document.getElementById('recommendedGrid');
    let recProducts = [];
    
    if (clickedProduct) {
        recProducts = products.filter(p => p.category === clickedProduct.category && p.id !== clickedProduct.id).slice(0, 4);
    } else {
        const topPref = Object.entries(prefs).reduce((a, b) => a[1] > b[1] ? a : b)[0];
        recProducts = products.filter(p => p.category === topPref).slice(0, 4);
    }
    
    recGrid.innerHTML = recProducts.map(p => `
        <div class="product-card" onclick="openProductModal('${p.id}')">
            <div class="product-image">${p.icon || '📦'}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">₹${parseFloat(p.price || 0).toLocaleString()}</div>
            <button class="add-to-cart" onclick="addToCart(event, '${p.id}')">❤️ Similar</button>
        </div>
    `).join('') || '<div style="text-align:center;padding:20px;color:#666">No recommendations yet</div>';
}

// 🔥 CHECKOUT (unchanged)
function goToCheckout() {
    if (cart.length === 0) return showOrderPopup(false, 'Cart is empty!');
    
    document.getElementById('checkoutItems').innerHTML = cart.map(p => `
        <div style="padding:15px;background:white;margin-bottom:10px;border-radius:12px">
            ${p.icon} ${p.name} - ₹${parseFloat(p.price).toLocaleString()}
        </div>
    `).join('');
    document.getElementById('checkoutTotal').textContent = cart.reduce((s, p) => s + p.price, 0).toLocaleString();
    document.getElementById('checkoutPage').style.display = 'block';
}

function closeCheckout() {
    document.getElementById('checkoutPage').style.display = 'none';
}

function placeOrder() {
    showOrderPopup(true, 'Order placed successfully! Thank you for shopping!');
    cart = [];
    localStorage.removeItem("cart");
    updateCartUI();
    closeCheckout();
    toggleCart();
}

function submitAdmin() {
    window.location.href = 'admin_login.html';
}

// 🔥 INIT
updateCartUI();
loadProducts();
updateRecommendations();
</script>
</body>
</html>
